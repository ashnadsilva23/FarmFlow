{% with messages = get_flashed_messages() %}
{% if messages %}
<ul class="flashes">
    {% for message in messages %}
    <script type="text/javascript">alert("{{message}}")</script>
    {% endfor %}
</ul>
{% endif %}
{% endwith %}

<!-- ✅ Include Header -->
{% include 'public_header.html' %}

<div class="container">
    <div class="login-box">
        <h2>Log In</h2>
        <p class="subtitle">Login using your username and password</p>
        <form method="post">
            <div class="input-group">
                <i class="fa fa-user-circle"></i>
                <input type="text" name="uname" placeholder="Username" required>
            </div>

            <div class="input-group">
                <i class="fa fa-key"></i>
                <input type="password" name="password" placeholder="Password" id="pwd" required>
                <i class="fa fa-eye password-toggle" onclick="togglePassword()"></i>
            </div>

            <button type="submit" class="btn-login">Log In</button>
        </form>

        <div class="forgot-password">
            <a href="/forgot-password">Forgot Password?</a>
        </div>
    </div>
</div>

<!-- ✅ Include Footer -->
{% include 'footer.html' %}

<style>
/* Google Fonts */
@import url('https://fonts.googleapis.com/css?family=Poppins:wght@300;400;600&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    background: linear-gradient(135deg, #E3FDF5 0%, #FFE6FA 100%);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
}

.container {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.login-box {
    background: #fff;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    text-align: center;
    width: 100%;
    max-width: 400px;
}

h2 {
    font-size: 24px;
    font-weight: 600;
    margin-bottom: 10px;
    color: #333;
}

.subtitle {
    font-size: 14px;
    color: #777;
    margin-bottom: 20px;
}

.input-group {
    display: flex;
    align-items: center;
    background: #f3f3f3;
    padding: 10px;
    border-radius: 5px;
    margin-bottom: 15px;
}

.input-group i {
    color: #6cb2eb;
    margin-right: 10px;
}

.input-group input {
    border: none;
    background: transparent;
    width: 100%;
    padding: 8px;
    outline: none;
}

.password-toggle {
    cursor: pointer;
}

.btn-login {
    background: #6cb2eb;
    color: white;
    border: none;
    padding: 12px;
    width: 100%;
    border-radius: 5px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

.btn-login:hover {
    background: #4a90e2;
}

.forgot-password {
    margin-top: 15px;
}

.forgot-password a {
    color: #6cb2eb;
    text-decoration: none;
    font-size: 14px;
}

.forgot-password a:hover {
    text-decoration: underline;
}

/* ✅ Footer */
.footer {
    text-align: center;
    padding: 10px;
    background: #333;
    color: white;
    font-size: 14px;
    margin-top: auto;
}
</style>

<script>
function togglePassword() {
    var passwordField = document.getElementById('pwd');
    if (passwordField.type === 'password') {
        passwordField.type = 'text';
    } else {
        passwordField.type = 'password';
    }
}
</script>
