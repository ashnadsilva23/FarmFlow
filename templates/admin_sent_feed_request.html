{% include 'admin_header.html' %}

      <div id="wrapper">
          <div id="inputs">
              <div>
                  <form name="input" action="#" method="post">
                      <h1 class="form-title">Request For Feed Filling</h1>
      
                      <div class="form-group">
                          <label for="Litter">No Packet </label>
                          <input type="number" name="quantity" required placeholder="In nubers of packet" class="form-control">
                      </div>
                      <div class="form-group">
                          <input type="submit" value="Submit" name="submitbutton" class="btn btn-submit">
                      </div>
                  </form>
              </div>
          </div>
      </div>
      
      {% include 'footer.html' %}
      
     
      <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
    
        #wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
        }
    
        #inputs {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
            box-sizing: border-box;
        }
    
        .form-title {
            text-align: center;
            font-size: 2em;
            color: #007bff;
            margin-bottom: 20px;
        }
    
        .form-group {
            margin-bottom: 15px;
        }
    
        .form-group label {
            font-size: 1.1em;
            color: #333;
            margin-bottom: 5px;
            display: block;
        }
    
        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }
    
        .form-control:focus {
            border-color: #007bff;
            outline: none;
        }
    
        .btn-submit {
            background-color: #007bff;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1.2em;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s ease;
        }
    
        .btn-submit:hover {
            background-color: #0056b3;
        }
    
        .flashes {
            list-style-type: none;
            padding: 0;
            margin: 20px 0;
        }
    
        .flashes li {
            background-color: #f8d7da;
            color: #721c24;
            padding: 15px;
            border: 1px solid #f5c6cb;
            border-radius: 8px;
            margin-bottom: 10px;
        }
    
        /* Responsive Design */
        @media (max-width: 768px) {
            #inputs {
                padding: 20px;
                width: 100%;
                box-sizing: border-box;
            }
    
            .form-title {
                font-size: 1.8em;
            }
    
            .form-control {
                padding: 10px;
            }
    
            .btn-submit {
                font-size: 1em;
            }
        }
    </style>
