{% include 'admin_header.html' %}
<center>
    <!-- Features Start -->
    <div class="container-xxl py-5 d-flex justify-content-center">
        <div class="container">
            <div class="row g-5 align-items-center justify-content-center">
                <div class="col-lg-6 wow fadeInUp" data-wow-delay="0.1s">
                    <p class="section-title bg-white text-start text-primary pe-3 text-center">Add Milk collection!</p>
                    <div class="row mt-5 justify-content-center">
                        <div class="col-lg-6">
                            <div class="rounded overflow-hidden text-center">
                                <form method="post">
                                    <table style="width: 500px; margin: auto;">
                                        <tr>
                                            <th>Farmer</th>
                                            <td>
                                                <select name="farmer" id="farmer" class="form-control">
                                                    {% for i in data['farmer'] %}
                                                    <option value="{{ i['farmer_id'] }}">{{ i['firstname'] }} {{ i['lastname'] }}</option>
                                                    {% endfor %}
                                                </select>
                                            </td>
                                        </tr>
                                        <tr>
                                            <th>Liters</th>
                                            <td><input type="number" class="form-control" required name="milk_in_litter"></td>
                                        </tr>
                                        <tr>
                                            <th>Fat</th>
                                            <td><input type="number" step="0.1" class="form-control" required name="fat"></td>
                                        </tr>
                                        <tr>
                                            <th>SNF</th>
                                            <td><input type="number" step="0.1" class="form-control" required name="snf"></td>
                                        </tr>
                                        <tr>
                                            <td align="center" colspan="2">
                                                <input type="submit" class="btn btn-success" name="submitbutton">
                                            </td>
                                        </tr>
                                    </table>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Features End -->
</center>
{% include 'footer.html' %}
