<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href=
"https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<style>


    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700;900&display=swap');

    *, body {
        font-family: 'Poppins', sans-serif;
        font-weight: 400;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        -moz-osx-font-smoothing: grayscale;
    }
    
    html, body {
        height: 100%;
        background-color: #152733;
        overflow: hidden;
    }
    
    
    .form-holder {
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          text-align: center;
          min-height: 100vh;
    }
    
    .form-holder .form-content {
        position: relative;
        text-align: center;
        display: -webkit-box;
        display: -moz-box;
        display: -ms-flexbox;
        display: -webkit-flex;
        display: flex;
        -webkit-justify-content: center;
        justify-content: center;
        -webkit-align-items: center;
        align-items: center;
        padding: 60px;
    }
    
    .form-content .form-items {
        border: 3px solid #fff;
        padding: 40px;
        display: inline-block;
        width: 100%;
        min-width: 540px;
        -webkit-border-radius: 10px;
        -moz-border-radius: 10px;
        border-radius: 10px;
        text-align: left;
        -webkit-transition: all 0.4s ease;
        transition: all 0.4s ease;
    }
    
    .form-content h3 {
        color: #fff;
        text-align: left;
        font-size: 28px;
        font-weight: 600;
        margin-bottom: 5px;
    }
    
    .form-content h3.form-title {
        margin-bottom: 30px;
    }
    
    .form-content p {
        color: #fff;
        text-align: left;
        font-size: 17px;
        font-weight: 300;
        line-height: 20px;
        margin-bottom: 30px;
    }
    
    
    .form-content label, .was-validated .form-check-input:invalid~.form-check-label, .was-validated .form-check-input:valid~.form-check-label{
        color: #fff;
    }
    
    .form-content input[type=text], .form-content input[type=password], .form-content input[type=email], .form-content select {
        width: 100%;
        padding: 9px 20px;
        text-align: left;
        border: 0;
        outline: 0;
        border-radius: 6px;
        background-color: #fff;
        font-size: 15px;
        font-weight: 300;
        color: #8D8D8D;
        -webkit-transition: all 0.3s ease;
        transition: all 0.3s ease;
        margin-top: 16px;
    }
    
    
    .btn-primary{
        background-color: #6C757D;
        outline: none;
        border: 0px;
         box-shadow: none;
    }
    
    .btn-primary:hover, .btn-primary:focus, .btn-primary:active{
        background-color: #495056;
        outline: none !important;
        border: none !important;
         box-shadow: none;
    }
    
    .form-content textarea {
        position: static !important;
        width: 100%;
        padding: 8px 20px;
        border-radius: 6px;
        text-align: left;
        background-color: #fff;
        border: 0;
        font-size: 15px;
        font-weight: 300;
        color: #8D8D8D;
        outline: none;
        resize: none;
        height: 120px;
        -webkit-transition: none;
        transition: none;
        margin-bottom: 14px;
    }
    
    .form-content textarea:hover, .form-content textarea:focus {
        border: 0;
        background-color: #ebeff8;
        color: #8D8D8D;
    }
    
    .mv-up{
        margin-top: -9px !important;
        margin-bottom: 8px !important;
    }
    
    .invalid-feedback{
        color: #ff606e;
    }
    
    .valid-feedback{
       color: #2acc80;
    }


</style>
<body>
    <div class="form-body">
        <div class="row">
            <div class="form-holder">
                <div class="form-content">
                    <div class="form-items">
                        <h3>Register Today</h3>
                        <p>Fill in the data below.</p>
                        <form method="post" class="requires-validation" novalidate>

                            <div class="col-md-12">
                               <input class="form-control" type="text" name="firstname" placeholder="First Name" required>
                            </div>
                            <div class="col-md-12">
                                <input class="form-control" type="text" name="lastname" placeholder="Last Name" required>
                             </div>                            
                             <div class="col-md-12">
                                <input class="form-control" type="text" name="city" placeholder="City" required>
                             </div>
                            <div class="col-md-12">
                                <input class="form-control" type="text" placeholder="Phone" required="" pattern="[0-9]{10}" maxlength="10" name="phone">
                            </div>
                            <div class="col-md-12">
                                <input class="form-control" type="email" name="email" placeholder="Email" required>
                            </div>
                            <div class="col-md-12">
                                <input class="form-control" type="text" name="username" placeholder="Username" required>
                             </div>
                             <div class="col-md-12">
                                <input 
                                    type="password" 
                                    class="form-control" 
                                    required 
                                    name="password" 
                                    id="password" 
                                   
                                    title="Password must be at least 7 characters long, with at least one uppercase letter, one lowercase letter, one digit, and one special character."
                                    placeholder="Password" 
                                    oninput="validatePassword()">
                                <div id="password-error" class="text-danger" style="display: none;">
                                    Password must be at least 7 characters long, contain at least one uppercase letter, one lowercase letter, one digit, and one special character.
                                </div>
                            </div>
                            
                        <center>
                            <div class="form-button mt-3" style="margin-top: 10px;">
                                <button id="submit" type="submit" class="btn btn-primary" name="submitbutton">Register</button>
                            </div>
                        </center>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
<script>



    (function () {
        'use strict'
        const forms = document.querySelectorAll('.requires-validation')
        Array.from(forms)
          .forEach(function (form) {
            form.addEventListener('submit', function (event) {
              if (!form.checkValidity()) {
                event.preventDefault()
                event.stopPropagation()
              }
        
              form.classList.add('was-validated')
            }, false)
          })
        })()
        

</script>
</body>
</html>

<script>
    function validatePassword() {
        var password = document.getElementById("password");
        var errorDiv = document.getElementById("password-error");
        var pattern = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{7,}$/;
    
        // Check if the password matches the pattern
        if (password.value.match(pattern)) {
            errorDiv.style.display = "none";  // Hide error message
        } else {
            errorDiv.style.display = "block";  // Show error message
        }
    }
    
</script>
