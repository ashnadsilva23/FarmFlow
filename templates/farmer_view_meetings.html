{% include 'farmer_header.html' %}



<center>


    <!-- Features Start -->
    <div class="container-xxl py-5">
        <div class="container">
                <div class="col-lg-6 wow fadeInUp" data-wow-delay="0.1s">
                    <p class="section-title bg-white text-start text-primary pe-3">Scheduled Mettings!</p>
                    <div class="cart-container">
                        <table class="table">
                            <tr>
                                <th>Sl.No</th>
                                <th>Link</th>
                                <th>Description</th>
                                <th>Schedule Date</th>
                            </tr>
                            {% for i in data['view'] %}
                            <tr>
                                <td>{{ loop.index }}</td>
                                <td>{{ i['link'] }}</td>
                                <td>{{ i['description'] }}</td>
                                <td>{{ i['shedule_date'] }}</td>
                            </tr>
                            {% endfor %}
                        </table>
                    </div>
                </div>

        </div>
    </div>
    <!-- Features End -->
    

</center>
